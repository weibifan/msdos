# Sega Genesis Emulation — DOSBox Configuration
# Optimized for Genecyst + Road Rash

[sdl]
fullscreen=false
fullresolution=0x0
windowresolution=960x720
output=opengl
autolock=true
sensitivity=100

[dosbox]
machine=svga_s3
memsize=16

[cpu]
core=dynamic
cputype=pentium_slow
cycles=max
cycleup=1000
cycledown=500

[render]
frameskip=0
aspect=true
scaling=auto

[mixer]
rate=44100
blocksize=2048
prebuffer=10

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
mixer=true
oplmode=auto

[speaker]
pcspeaker=true

[joystick]
joysticktype=auto

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[autoexec]
mount C .
C:
run.bat
